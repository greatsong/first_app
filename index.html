<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>범용 바이브 코딩 웹앱</title>
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">GitHub Pages Web App Lab</p>
        <h1>데이터를 연결하는 작은 웹앱</h1>
        <p class="lead">정적 페이지에서 시작해 Google Sheets, Open API, DB까지 단계적으로 연결합니다.</p>
      </div>
      <button id="refreshButton" type="button">새로고침</button>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>오늘의 데이터</h2>
        <div id="status" class="status">초기 데이터를 불러오는 중...</div>
        <ul id="itemList" class="item-list"></ul>
      </section>

      <section class="panel">
        <h2>연동 상태</h2>
        <dl class="connection-list">
          <div>
            <dt>Google Sheets</dt>
            <dd id="sheetsState">샘플 데이터 사용 중</dd>
          </div>
          <div>
            <dt>Open API</dt>
            <dd id="apiState">샘플 데이터 사용 중</dd>
          </div>
          <div>
            <dt>Database</dt>
            <dd id="dbState">샘플 데이터 사용 중</dd>
          </div>
        </dl>
      </section>
    </main>

    <script src="./js/config.js"></script>
    <script src="./js/adapters/sample-data.js"></script>
    <script src="./js/adapters/google-sheets.js"></script>
    <script src="./js/adapters/open-api.js"></script>
    <script src="./js/adapters/database.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
